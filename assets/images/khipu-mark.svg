<!--
  Kipu · marca (copia de KipuMark / splash; fuente: mi_wallet assets/icon/khipu_master.svg).
  Khipu andino: una cuerda principal con tres cuerdas colgantes de distinto
  largo y nudos. Paleta = KipuBrand (lib/app/theme/app_colors.dart):
  tinta #12201B, hueso #F7F5EC, verde pino #00A86B, nudo ámbar #F59E0B.
  El grupo #mark queda dentro del círculo seguro de los adaptive icons
  (66/108 del lienzo). Regenerar con tool/generate_icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" rx="300" fill="#12201B"/>
  <g id="mark" transform="translate(512 512) scale(1.45) translate(-512 -524)">
    <g stroke="#F7F5EC" stroke-linecap="round">
      <line x1="330" y1="372" x2="694" y2="372" stroke-width="48"/>
      <line x1="394" y1="372" x2="394" y2="612" stroke-width="34"/>
      <line x1="512" y1="372" x2="512" y2="684" stroke-width="34"/>
      <line x1="630" y1="372" x2="630" y2="560" stroke-width="34"/>
    </g>
    <g fill="#00A86B">
      <circle cx="394" cy="470" r="36"/>
      <circle cx="394" cy="552" r="36"/>
      <circle cx="512" cy="548" r="36"/>
      <circle cx="512" cy="634" r="36"/>
      <circle cx="630" cy="478" r="36"/>
    </g>
    <circle cx="512" cy="462" r="36" fill="#F59E0B"/>
